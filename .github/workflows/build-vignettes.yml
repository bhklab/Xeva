name: build-vignettes

on:
  workflow_dispatch:
  push:
    branches:
      - devel
      - main

jobs:
  vignette-build:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: true
      TZ: UTC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Install system dependencies for LaTeX
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texinfo \
            ghostscript \
            texlive-extra-utils

      - name: Install BiocManager
        run: |
          install.packages('BiocManager', repos = 'https://cloud.r-project.org')
        shell: Rscript {0}

      - name: Set Bioconductor version
        run: |
          BiocManager::install(version = '3.21', ask = FALSE, force = TRUE)
        shell: Rscript {0}

      - name: Install package dependencies (build vignettes)
        run: |
          install.packages('rcmdcheck', repos = BiocManager::repositories())
          remotes::install_local(
            dependencies = TRUE,
            repos = BiocManager::repositories(),
            build_vignettes = TRUE,
            upgrade = TRUE,
            force = TRUE
          )
        shell: Rscript {0}

      - name: Run CMD check with vignettes
        env:
          _R_CHECK_CRAN_INCOMING_: false
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args = c('--no-manual', '--timings'),
            ## Allow building vignettes at tarball time
            build_args = c('--no-manual', '--keep-empty-dirs', '--no-resave-data'),
            error_on = 'warning',
            check_dir = 'check'
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-latest-vignette-results
          path: check

